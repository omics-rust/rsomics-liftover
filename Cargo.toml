[package]
name = "rsomics-liftover"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-liftover"
authors = ["Zane Leong <efd@live.com>"]
description = "Lift BED interval coordinates between assemblies via a UCSC chain file — Rust port of UCSC liftOver"
categories = ["science", "command-line-utilities"]
keywords = ["liftover", "chain", "bed", "ucsc", "bioinformatics"]

[[bin]]
name = "rsomics-liftover"
path = "src/main.rs"

[lib]
name = "rsomics_liftover"
path = "src/lib.rs"
doctest = false

[dependencies]
rsomics-common = { version = "0.6" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "bench"
harness = false
