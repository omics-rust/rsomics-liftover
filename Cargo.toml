[package]
name = "rsomics-liftover"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-liftover"
authors = ["Zane Leong <efd@live.com>"]
description = "Translate genomic intervals between assemblies through UCSC chain files"
homepage = "https://github.com/omics-rust/rsomics-liftover"
documentation = "https://docs.rs/rsomics-liftover"
categories = ["science", "command-line-utilities"]
keywords = ["liftover", "chain", "bed", "ucsc", "bioinformatics"]
readme = "README.md"

[[bin]]
name = "rsomics-liftover"
path = "src/main.rs"

[lib]
name = "rsomics_liftover"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rsomics-common = "0.11"
rsomics-help = "0.4"
rsomics-intervals = "0.3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"
