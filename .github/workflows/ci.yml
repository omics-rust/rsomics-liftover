name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - if: startsWith(matrix.runner, 'macos-')
        shell: bash
        run: |
          case "${{ matrix.runner }}" in
            macos-15)
              url='https://hgdownload.soe.ucsc.edu/admin/exe/macOSX.arm64/liftOver'
              expected='0604b6ef4a0ae5dd56847950469fe000df7e206f235a05b3d1332e226823969d'
              ;;
            macos-15-intel)
              url='https://hgdownload.soe.ucsc.edu/admin/exe/macOSX.x86_64/liftOver'
              expected='464a2850020a25b79d8931f0e9f7091b180333ec0579cdec88da69558ddff0f2'
              ;;
          esac
          oracle="$RUNNER_TEMP/liftOver"
          curl --fail --location --retry 3 --max-time 180 "$url" --output "$oracle"
          actual=$(shasum -a 256 "$oracle" | awk '{print $1}')
          test "$actual" = "$expected"
          chmod +x "$oracle"
          echo "RSOMICS_LIFTOVER=$oracle" >> "$GITHUB_ENV"
          echo 'RSOMICS_REQUIRE_LIFTOVER=1' >> "$GITHUB_ENV"
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.runner == 'ubuntu-24.04'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo package --locked
      - run: cargo test --locked --all-features
      - run: cargo test --release --locked --all-features
